<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BABUU OLE KASUKU — DASHBOARD</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background: #8b0000;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .dashboard {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .menu button {
      padding: 20px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .menu button:hover {
      background: #8b0000;
    }

    .add-news {
      background: white;
      margin-top: 25px;
      padding: 25px;
      border-radius: 10px;
    }

    .add-news h2 {
      margin-top: 0;
      color: #8b0000;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .publish {
      margin-top: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 7px;
      background: green;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .publish:disabled {
      background: #777;
      cursor: not-allowed;
    }

    #image_preview {
      max-width: 300px;
      max-height: 200px;
      margin-top: 15px;
      display: none;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 30px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>🦜 BABUU OLE KASUKU</h1>
    <p>DASHBOARD YA USIMAMIZI</p>
  </header>

  <main class="dashboard">

    <div class="welcome">
      <h2>Karibu kwenye Dashboard</h2>
      <p>
        Hapa tutaweza kusimamia habari, hadithi, burudani,
        makala na maudhui mbalimbali ya BABUU OLE KASUKU.
      </p>
    </div>

    <div class="menu">
      <button>📝 Ongeza Habari</button>
      <button>📚 Ongeza Hadithi</button>
      <button>🎭 Ongeza Burudani</button>
      <button>📖 Ongeza Makala</button>
      <button>🖼️ Ongeza Picha</button>
      <button>✏️ Hariri</button>
      <button>🗑️ Futa</button>
      <button>🔎 Tafuta</button>
    </div>
<!-- HABARI ZILIZOPO -->
<div class="add-news" id="edit-section">

  <h2>✏️ Hariri Habari</h2>

  <div id="posts-list">
    <p>Inapakia habari zilizopo...</p>
  </div>

</div>
<div class="add-news">

  <h2>📝 Ongeza Habari</h2>
      

      <label for="title">Kichwa cha Habari</label>
      <input
        type="text"
        id="title"
        placeholder="Andika kichwa cha habari hapa"
      >

      <label for="category">Kategoria</label>
      <select id="category">
        <option value="habari">Habari Mchanganyiko</option>
        <option value="michezo">Habari za Michezo</option>
        <option value="burudani">Burudani</option>
        <option value="makala">Makala</option>
        <option value="hadithi">Hadithi</option>
      </select>

      <label for="content">Maudhui ya Habari</label>
      <textarea
        id="content"
        placeholder="Andika habari yako hapa..."
      ></textarea>

      <label for="image_file">📷 Chagua Picha kutoka kwenye Kompyuta</label>
      <input
        type="file"
        id="image_file"
        accept="image/*"
      >

      <img id="image_preview" alt="Muonekano wa picha">

      <button class="publish">
        🟢 CHAPISHA HABARI
      </button>

    </div>

  </main>

  <footer>
    © 2026 BABUU OLE KASUKU
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://tykxdrucylyamvhgfjdq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IHcI_DjtdVEMuQYUXCFakw_ygboXT8I';

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const publishButton = document.querySelector('.publish');
    const imageFile = document.querySelector('#image_file');
    const imagePreview = document.querySelector('#image_preview');

    imageFile.addEventListener('change', function () {
      const file = imageFile.files[0];

      if (!file) {
        imagePreview.style.display = 'none';
        return;
      }

      if (!file.type.startsWith('image/')) {
        alert('Tafadhali chagua faili la picha.');
        imageFile.value = '';
        imagePreview.style.display = 'none';
        return;
      }

      const reader = new FileReader();

      reader.onload = function (event) {
        imagePreview.src = event.target.result;
        imagePreview.style.display = 'block';
      };

      reader.readAsDataURL(file);
    });

    publishButton.addEventListener('click', async function () {

      const title = document.querySelector('#title').value.trim();
      const category = document.querySelector('#category').value;
      const content = document.querySelector('#content').value.trim();
      const file = imageFile.files[0];

      if (!title || !content) {
        alert('Tafadhali jaza kichwa na maudhui ya habari.');
        return;
      }

      publishButton.disabled = true;
      publishButton.textContent = '⏳ Inapakia...';

      let image_url = null;

      try {

        if (file) {

          const fileExtension = file.name.split('.').pop();
          const fileName =
            Date.now() + '-' +
            Math.random().toString(36).substring(2, 8) +
            '.' +
            fileExtension;

          const filePath = 'habari/' + fileName;

          const { error: uploadError } = await supabaseClient
            .storage
            .from('image_url')
            .upload(filePath, file);

          if (uploadError) {
            console.error('Hitilafu ya kupakia picha:', uploadError);
            throw new Error(
              'Picha haikuweza kupakiwa: ' + uploadError.message
            );
          }

          const { data: publicUrlData } =
            supabaseClient
              .storage
              .from('image_url')
              .getPublicUrl(filePath);

          image_url = publicUrlData.publicUrl;
        }

        const { data, error } = await supabaseClient
          .from('posts')
          .insert([
            {
              title: title,
              category: category,
              content: content,
              image_url: image_url
            }
          ])
          .select();

        if (error) {
          console.error('Hitilafu ya kuhifadhi habari:', error);
          throw new Error(
            'Habari haikuweza kuhifadhiwa: ' + error.message
          );
        }

        alert('Habari imechapishwa kikamilifu! 🎉');

        document.querySelector('#title').value = '';
        document.querySelector('#content').value = '';
        imageFile.value = '';
        imagePreview.src = '';
        imagePreview.style.display = 'none';

        console.log('Habari imehifadhiwa:', data);

      } catch (error) {

        console.error('Hitilafu:', error);
        alert(error.message);

      } finally {

        publishButton.disabled = false;
        publishButton.textContent = '🟢 CHAPISHA HABARI';

      }

    });
  </script>

</body>
</html>
